# gradle.properties - Optimized for faster builds

# Enable Gradle Build Cache
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true

# Optimize JVM settings for build performance
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Enable configuration cache (Gradle 6.6+) - Comment out if using older Gradle
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Enable Gradle daemon
org.gradle.daemon=true

# Disable configure on demand (can cause issues with multi-module projects)
org.gradle.configureondemand=false

# Set console output
org.gradle.console=verbose

# Worker optimization
org.gradle.workers.max=4

# Android specific optimizations
android.useAndroidX=true
android.enableJetifier=true

# Kotlin compiler optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.incremental.js=true
kotlin.incremental.multiplatform=true

# Kapt optimizations
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# R8/ProGuard optimizations
android.enableR8.fullMode=true
android.enableR8=true

# Disable unnecessary build features for libraries
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false

# Enable non-transitive R class generation (Android Gradle Plugin 4.1+)
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Enable resource optimizations
android.enableResourceOptimizations=true