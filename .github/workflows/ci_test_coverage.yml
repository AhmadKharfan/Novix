name: CI – Optimized Test Coverage

on:
  pull_request:
    branches: [main, development]

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper diff

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Prepare google-services.json
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "✅  Decoding google-services.json from secret…"
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
            grep -q '"project_info"' app/google-services.json
          else
            echo "ℹ️  Secret missing – using stub google-services.json"
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_number": "000000000000",' \
              '    "project_id": "stub-project"' \
              '  }' \
              '}' > app/google-services.json
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keys.properties
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > keys.properties
          cp keys.properties ./data/remote_data_source/vod/keys.properties

      - name: 🔍 Detect modules needing tests
        id: test_changes
        run: |
          # Get the base branch for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          echo "Comparing against: $BASE_SHA"
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only $BASE_SHA HEAD || echo "")
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Function to check if module needs testing
          check_test_needed() {
            local module_path="$1"
            local output_var="$2"
            # Check if module has source changes (not just test changes)
            if echo "$CHANGED_FILES" | grep -qE "^${module_path}/(src/main|build\.gradle)"; then
              echo "${output_var}=true" >> $GITHUB_OUTPUT
              echo "✅ Module $module_path needs testing"
            else
              echo "${output_var}=false" >> $GITHUB_OUTPUT
            fi
          }
          
          # Check modules that typically have unit tests
          check_test_needed "domain/vod" "test_domain_vod"
          check_test_needed "domain/identity" "test_domain_identity"
          check_test_needed "data/repositories/vod" "test_data_repositories_vod"
          check_test_needed "data/repositories/identity" "test_data_repositories_identity"
          check_test_needed "data/remote_data_source/vod" "test_data_remote_vod"
          check_test_needed "data/remote_data_source/identity" "test_data_remote_identity"
          check_test_needed "data/local_data_source/vod" "test_data_local_vod"
          check_test_needed "data/local_data_source/identity" "test_data_local_identity"
          
          # Feature modules that might have tests
          check_test_needed "feature/authentication/api" "test_feature_auth_api"
          check_test_needed "feature/authentication/presentation" "test_feature_auth_presentation"
          check_test_needed "feature/home/api" "test_feature_home_api"
          check_test_needed "feature/home/presentation" "test_feature_home_presentation"
          check_test_needed "feature/user_profile/api" "test_feature_profile_api"
          check_test_needed "feature/user_profile/presentation" "test_feature_profile_presentation"
          check_test_needed "feature/playlists/api" "test_feature_playlists_api"
          check_test_needed "feature/playlists/presentation" "test_feature_playlists_presentation"
          check_test_needed "feature/search/api" "test_feature_search_api"
          check_test_needed "feature/search/presentation" "test_feature_search_presentation"
          check_test_needed "feature/media_details/api" "test_feature_media_details_api"
          check_test_needed "feature/media_details/presentation" "test_feature_media_details_presentation"
          check_test_needed "feature/onboarding/api" "test_feature_onboarding_api"
          check_test_needed "feature/onboarding/presentation" "test_feature_onboarding_presentation"
          check_test_needed "feature/category/api" "test_feature_category_api"
          check_test_needed "feature/category/presentation" "test_feature_category_presentation"
          
          # Check for root-level changes
          if echo "$CHANGED_FILES" | grep -qE '^(build\.gradle|settings\.gradle|gradle\.properties|build-logic/)'; then
            echo "test_all=true" >> $GITHUB_OUTPUT
            echo "✅ Root build files changed - will test all modules"
          else
            echo "test_all=false" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Run tests for changed modules
        run: |
          TEST_TASKS=""
          KOVER_TASKS=""
          
          # If root files changed, test everything
          if [ "${{ steps.test_changes.outputs.test_all }}" = "true" ]; then
            echo "🔄 Root files changed - running all tests"
            ./gradlew test koverXmlReport koverHtmlReport --parallel --build-cache
            exit 0
          fi
          
          # Domain modules
          if [ "${{ steps.test_changes.outputs.test_domain_vod }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :domain:vod:test"
            KOVER_TASKS="$KOVER_TASKS :domain:vod:koverXmlReport :domain:vod:koverHtmlReport"
            echo "🎬 Testing domain:vod"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_domain_identity }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :domain:identity:test"
            KOVER_TASKS="$KOVER_TASKS :domain:identity:koverXmlReport :domain:identity:koverHtmlReport"
            echo "👤 Testing domain:identity"
          fi
          
          # Data layer modules
          if [ "${{ steps.test_changes.outputs.test_data_repositories_vod }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :data:repositories:vod:test"
            KOVER_TASKS="$KOVER_TASKS :data:repositories:vod:koverXmlReport :data:repositories:vod:koverHtmlReport"
            echo "📚 Testing data:repositories:vod"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_data_repositories_identity }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :data:repositories:identity:test"
            KOVER_TASKS="$KOVER_TASKS :data:repositories:identity:koverXmlReport :data:repositories:identity:koverHtmlReport"
            echo "📚 Testing data:repositories:identity"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_data_remote_vod }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :data:remote_data_source:vod:test"
            KOVER_TASKS="$KOVER_TASKS :data:remote_data_source:vod:koverXmlReport :data:remote_data_source:vod:koverHtmlReport"
            echo "🌐 Testing data:remote_data_source:vod"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_data_remote_identity }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :data:remote_data_source:identity:test"
            KOVER_TASKS="$KOVER_TASKS :data:remote_data_source:identity:koverXmlReport :data:remote_data_source:identity:koverHtmlReport"
            echo "🌐 Testing data:remote_data_source:identity"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_data_local_vod }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :data:local_data_source:vod:test"
            KOVER_TASKS="$KOVER_TASKS :data:local_data_source:vod:koverXmlReport :data:local_data_source:vod:koverHtmlReport"
            echo "💾 Testing data:local_data_source:vod"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_data_local_identity }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :data:local_data_source:identity:test"
            KOVER_TASKS="$KOVER_TASKS :data:local_data_source:identity:koverXmlReport :data:local_data_source:identity:koverHtmlReport"
            echo "💾 Testing data:local_data_source:identity"
          fi
          
          # Feature API modules
          if [ "${{ steps.test_changes.outputs.test_feature_auth_api }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :feature:authentication:api:test"
            KOVER_TASKS="$KOVER_TASKS :feature:authentication:api:koverXmlReport :feature:authentication:api:koverHtmlReport"
            echo "🔑 Testing feature:authentication:api"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_feature_home_api }}" = "true" ]; then
            TEST_TASKS="$TEST_TASKS :feature:home:api:test"
            KOVER_TASKS="$KOVER_TASKS :feature:home:api:koverXmlReport :feature:home:api:koverHtmlReport"
            echo "🏠 Testing feature:home:api"
          fi
          
          # Add more feature modules as needed...
          
          # Execute test tasks
          if [ -n "$TEST_TASKS" ]; then
            echo "🚀 Running tests: $TEST_TASKS"
            ./gradlew $TEST_TASKS --parallel --build-cache
          
            if [ -n "$KOVER_TASKS" ]; then
              echo "📊 Generating coverage reports: $KOVER_TASKS"
              ./gradlew $KOVER_TASKS --parallel --build-cache
            fi
          else
            echo "ℹ️ No modules need testing - skipping tests"
          fi

      - name: 🔍 Run Kover verification for tested modules
        if: steps.test_changes.outputs.test_all == 'true' || contains(steps.test_changes.outputs.*, 'true')
        continue-on-error: true
        run: |
          VERIFY_TASKS=""
          
          # Add koverVerify tasks for modules that were tested
          if [ "${{ steps.test_changes.outputs.test_domain_vod }}" = "true" ]; then
            VERIFY_TASKS="$VERIFY_TASKS :domain:vod:koverVerify"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_domain_identity }}" = "true" ]; then
            VERIFY_TASKS="$VERIFY_TASKS :domain:identity:koverVerify"
          fi
          
          if [ "${{ steps.test_changes.outputs.test_data_repositories_vod }}" = "true" ]; then
            VERIFY_TASKS="$VERIFY_TASKS :data:repositories:vod:koverVerify"
          fi
          
          # Add more modules as needed...
          
          if [ -n "$VERIFY_TASKS" ]; then
            echo "🔍 Verifying coverage: $VERIFY_TASKS"
            ./gradlew $VERIFY_TASKS --parallel --build-cache
          fi

      - name: 📊 Upload coverage to Codecov
        if: steps.test_changes.outputs.test_all == 'true' || contains(steps.test_changes.outputs.*, 'true')
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            domain/vod/build/reports/kover/report.xml
            domain/identity/build/reports/kover/report.xml
            data/repositories/vod/build/reports/kover/report.xml
            data/repositories/identity/build/reports/kover/report.xml
            data/remote_data_source/vod/build/reports/kover/report.xml
            data/remote_data_source/identity/build/reports/kover/report.xml
            data/local_data_source/vod/build/reports/kover/report.xml
            data/local_data_source/identity/build/reports/kover/report.xml
          flags: unittests
          name: novix-coverage-report
          fail_ci_if_error: false

      - name: 📝 Upload test results
        if: always() && (steps.test_changes.outputs.test_all == 'true' || contains(steps.test_changes.outputs.*, 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/kover/