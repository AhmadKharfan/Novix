name: CI - Smart Build & Test

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=true
  JAVA_TOOL_OPTIONS: -Xmx4g -XX:+UseG1GC

jobs:
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build-all: ${{ steps.detect.outputs.build-all }}
      test-modules: ${{ steps.detect.outputs.test-modules }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Detect changed modules and dependencies
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Comparing: $BASE_SHA...$HEAD_SHA"
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "build-all=false" >> $GITHUB_OUTPUT
            echo "test-modules=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Check for root-level changes
          if echo "$CHANGED_FILES" | grep -qE '^(build\.gradle|settings\.gradle|gradle\.properties|build-logic/)'; then
            echo "🔄 Root build files changed"
            echo "build-all=true" >> $GITHUB_OUTPUT
            echo "test-modules=[\"all\"]" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Define module mappings
          declare -A modules
          modules["app/"]=":app"
          modules["tvapp/"]=":tvapp"
          modules["data/repositories/vod/"]=":data:repositories:vod"
          modules["data/remote_data_source/vod/"]=":data:remote_data_source:vod"
          modules["data/local_data_source/vod/"]=":data:local_data_source:vod"
          modules["data/repositories/identity/"]=":data:repositories:identity"
          modules["data/remote_data_source/identity/"]=":data:remote_data_source:identity"
          modules["data/local_data_source/identity/"]=":data:local_data_source:identity"
          modules["domain/vod/"]=":domain:vod"
          modules["domain/identity/"]=":domain:identity"
          modules["design_system/"]=":design_system"
          modules["image_viewer/"]=":image_viewer"
          modules["feature/authentication/api/"]=":feature:authentication:api"
          modules["feature/authentication/presentation/"]=":feature:authentication:presentation"
          modules["feature/home/api/"]=":feature:home:api"
          modules["feature/home/presentation/"]=":feature:home:presentation"
          modules["feature/user_profile/api/"]=":feature:user_profile:api"
          modules["feature/user_profile/presentation/"]=":feature:user_profile:presentation"
          modules["feature/playlists/api/"]=":feature:playlists:api"
          modules["feature/playlists/presentation/"]=":feature:playlists:presentation"
          modules["feature/search/api/"]=":feature:search:api"
          modules["feature/search/presentation/"]=":feature:search:presentation"
          modules["feature/media_details/api/"]=":feature:media_details:api"
          modules["feature/media_details/presentation/"]=":feature:media_details:presentation"
          modules["feature/onboarding/api/"]=":feature:onboarding:api"
          modules["feature/onboarding/presentation/"]=":feature:onboarding:presentation"
          modules["feature/category/api/"]=":feature:category:api"
          modules["feature/category/presentation/"]=":feature:category:presentation"
          
          # Find changed modules
          changed_modules=()
          while IFS= read -r file; do
            for path in "${!modules[@]}"; do
              if [[ "$file" =~ ^"$path" ]]; then
                module="${modules[$path]}"
                if [[ ! " ${changed_modules[*]} " =~ " ${module} " ]]; then
                  changed_modules+=("$module")
                fi
                break
              fi
            done
          done <<< "$CHANGED_FILES"
          
          # Output changed modules for testing
          test_modules_json="["
          for module in "${changed_modules[@]}"; do
            if [ ${#test_modules_json} -gt 1 ]; then
              test_modules_json+=","
            fi
            test_modules_json+="\"$module\""
          done
          test_modules_json+="]"
          
          echo "build-all=false" >> $GITHUB_OUTPUT
          echo "test-modules=$test_modules_json" >> $GITHUB_OUTPUT
          
          echo "Changed modules: ${changed_modules[*]}"

      - name: 📋 Set matrix for parallel jobs
        id: set-matrix
        run: |
          if [ "${{ steps.detect.outputs.build-all }}" = "true" ]; then
            matrix='{"include":[{"name":"all","modules":"all"}]}'
          else
            # Create matrix based on changed modules
            modules='${{ steps.detect.outputs.test-modules }}'
            if [ "$modules" = "[]" ]; then
              matrix='{"include":[]}'
            else
              matrix='{"include":[{"name":"changed","modules":"'"$modules"'"}]}'
            fi
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.build-all == 'true' || needs.detect-changes.outputs.test-modules != '[]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: 📁 Setup build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare google-services.json
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "✅  Decoding google-services.json from secret…"
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
            grep -q '"project_info"' app/google-services.json
          else
            echo "ℹ️  Secret missing – using stub google-services.json"
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_number": "000000000000",' \
              '    "project_id": "stub-project"' \
              '  }' \
              '}' > app/google-services.json
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keys.properties
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > keys.properties
          cp keys.properties ./data/remote_data_source/vod/keys.properties

      - name: 🔧 Validate Gradle configuration
        run: ./gradlew help --no-daemon

      - name: 🏗️ Smart build
        run: |
          if [ "${{ needs.detect-changes.outputs.build-all }}" = "true" ]; then
            echo "🔄 Building all modules"
            ./gradlew assemble -x lintVitalRelease -x lint --parallel --build-cache --no-daemon
          else
            echo "🎯 Building specific modules: ${{ needs.detect-changes.outputs.test-modules }}"
          
            # Parse JSON array and build specific modules
            modules='${{ needs.detect-changes.outputs.test-modules }}'
          
            # Remove brackets and quotes, split by comma
            clean_modules=$(echo "$modules" | tr -d '[]"' | tr ',' ' ')
          
            if [ -n "$clean_modules" ]; then
              build_tasks=""
              for module in $clean_modules; do
                build_tasks="$build_tasks ${module}:assemble"
          
                # Build dependencies too
                case "$module" in
                  ":app")
                    build_tasks="$build_tasks :design_system:assemble :image_viewer:assemble"
                    ;;
                  ":feature:"*":presentation")
                    build_tasks="$build_tasks :design_system:assemble"
                    ;;
                  ":data:repositories:"*)
                    # Build related domain and data source modules
                    if [[ "$module" == *":vod" ]]; then
                      build_tasks="$build_tasks :domain:vod:assemble :data:remote_data_source:vod:assemble :data:local_data_source:vod:assemble"
                    elif [[ "$module" == *":identity" ]]; then
                      build_tasks="$build_tasks :domain:identity:assemble :data:remote_data_source:identity:assemble :data:local_data_source:identity:assemble"
                    fi
                    ;;
                esac
              done
          
              echo "🚀 Executing: ./gradlew $build_tasks"
              ./gradlew $build_tasks -x lintVitalRelease -x lint --parallel --build-cache --no-daemon
            else
              echo "ℹ️ No modules to build"
            fi
          fi

  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.test-modules != '[]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: 📁 Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare google-services.json
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          else
            printf '{"project_info":{"project_number":"000000000000","project_id":"stub-project"}}' > app/google-services.json
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keys.properties
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > keys.properties
          cp keys.properties ./data/remote_data_source/vod/keys.properties

      - name: 🧪 Run tests
        run: |
          if [ "${{ needs.detect-changes.outputs.build-all }}" = "true" ]; then
            echo "🔄 Running all tests"
            ./gradlew test koverXmlReport koverHtmlReport --parallel --build-cache --no-daemon
          else
            echo "🎯 Running tests for specific modules"
            modules='${{ needs.detect-changes.outputs.test-modules }}'
            clean_modules=$(echo "$modules" | tr -d '[]"' | tr ',' ' ')
          
            if [ -n "$clean_modules" ]; then
              test_tasks=""
              kover_tasks=""
          
              for module in $clean_modules; do
                # Only run tests for modules that typically have tests
                case "$module" in
                  ":domain:"*|":data:repositories:"*|":data:remote_data_source:"*|":data:local_data_source:"*)
                    test_tasks="$test_tasks ${module}:test"
                    kover_tasks="$kover_tasks ${module}:koverXmlReport ${module}:koverHtmlReport"
                    ;;
                esac
              done
          
              if [ -n "$test_tasks" ]; then
                echo "🚀 Executing tests: $test_tasks"
                ./gradlew $test_tasks --parallel --build-cache --no-daemon --continue
          
                if [ -n "$kover_tasks" ]; then
                  echo "📊 Generating coverage: $kover_tasks"
                  ./gradlew $kover_tasks --parallel --build-cache --no-daemon --continue
                fi
              else
                echo "ℹ️ No testable modules found"
              fi
            fi
          fi

      - name: 📊 Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/build/reports/kover/report.xml"
          flags: unittests
          name: novix-coverage-report
          fail_ci_if_error: false

      - name: 📋 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/kover/
          retention-days: 5

  summary:
    name: 📝 Build Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build, test]
    if: always()

    steps:
      - name: 📝 Summary
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.build-all }}" = "true" ]; then
            echo "- **Build Type**: Full build (root files changed)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.detect-changes.outputs.test-modules }}" = "[]" ]; then
            echo "- **Build Type**: No build needed (no modules changed)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Build Type**: Incremental build" >> $GITHUB_STEP_SUMMARY
            echo "- **Changed Modules**: ${{ needs.detect-changes.outputs.test-modules }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "- **Build Status**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Status**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY